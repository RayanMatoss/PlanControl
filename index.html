    <script>
      (function () {
        var themeKey = 'plancontrol_theme';
        var motionKey = 'plancontrol_motion';
        var validThemes = ['whiteboard','blueprint','kanban','focus','neon'];
        var validMotion = ['off','low','high'];
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        try {
          var t = localStorage.getItem(themeKey);
          if (!t || validThemes.indexOf(t) === -1) { t = 'whiteboard'; localStorage.setItem(themeKey, t); }
          document.documentElement.classList.add('theme-' + t);
          document.documentElement.setAttribute('data-theme', t);
          var m = reduced ? 'off' : (localStorage.getItem(motionKey) || 'high');
          if (validMotion.indexOf(m) === -1) m = 'high';
          document.documentElement.setAttribute('data-motion', m);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
